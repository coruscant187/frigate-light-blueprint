blueprint:
  name: Frigate Camera Light (1.0.0)
  description: |
    Keep a dimmable light on while people occupy selected Frigate zones,
    with optional motion sensors and a sun elevation condition.

    Requires MQTT with retained messages, the Frigate integration, and a dimmable
    light.
  domain: automation
  homeassistant:
    min_version: 2024.11.0
  input:
    camera:
      name: Frigate camera
      selector:
        entity:
          filter:
          - integration: frigate
            domain: camera
    light_entity:
      name: Light
      selector:
        entity:
          filter:
          - domain: light
      description: Select the dimmable light to control.
    zones:
      name: Required Frigate zones
      description: Enter exact Frigate zone IDs. At least one is required.
      selector:
        select:
          options: []
          multiple: true
          custom_value: true
    severities:
      name: Review severity levels
      description: detection is selected by default. Add alert to accept reviews that start at that level.
      default:
      - detection
      selector:
        select:
          options:
          - detection
          - alert
          multiple: true
    motion_sensors:
      name: Additional motion sensors
      description: Optional. Any selected sensor can request light when the sun elevation condition allows it.
      default: []
      selector:
        entity:
          filter:
          - domain: binary_sensor
          multiple: true
    sun_entity:
      name: Sun elevation entity
      description: Select sun.sun with its elevation attribute or a numeric sensor reporting sun elevation in degrees.
      default: sun.sun
      selector:
        entity:
          filter:
          - domain: sun
          - domain: sensor
    sun_threshold:
      name: Sun elevation threshold
      default: -3
      selector:
        number:
          min: -12
          max: 10
          step: 0.5
          unit_of_measurement: °
          mode: box
      description: Light is allowed at or below this elevation.
    brightness:
      name: Light brightness
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: slider
      description: Brightness while the light is on.
    off_delay:
      name: Cooldown after zones are clear
      default: 15
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s
          mode: box
      description: Starts when every selected zone reports zero people and all additional motion sensors are inactive.
    debug:
      name: Debug logging
      default: false
      selector:
        boolean: {}
      description: Write decisions to the Logbook and emit frigate_camera_light_status events.
    mqtt_topic:
      name: MQTT review topic
      default: frigate/reviews
      selector:
        text: {}
      description: The topic used by Frigate to publish review messages.
    maximum_on:
      name: Maximum continuous on-time
      description: Switch off at this limit. Recover after requests clear, or after fresh eligible activity and at least five
        seconds off.
      default: 5
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: min
          mode: box
    occupancy_prefix:
      name: MQTT person-count prefix
      description: Usually frigate, without a trailing slash. Counts use <prefix>/<zone_id>/person.
      default: frigate
      selector:
        text: {}
    object_topic:
      name: MQTT tracked-object topic
      description: Used to recognize a new person entering a selected zone, including within the same review.
      default: frigate/events
      selector:
        text: {}
mode: queued
max_exceeded: warning
trace:
  stored_traces: 100
trigger_variables:
  review_topic: !input 'mqtt_topic'
  occupancy_topic_prefix: !input 'occupancy_prefix'
  tracked_object_topic: !input 'object_topic'
triggers:
- trigger: mqtt
  topic: '{{ review_topic }}'
  id: review
- trigger: mqtt
  topic: '{{ tracked_object_topic }}'
  id: object
- trigger: mqtt
  topic: '{{ occupancy_topic_prefix ~ ''/+/person'' }}'
  id: occupancy
- trigger: state
  entity_id: !input 'motion_sensors'
  id: motion
- trigger: state
  entity_id: !input 'sun_entity'
  id: sun
- trigger: homeassistant
  event: start
  id: startup
- trigger: event
  event_type: automation_reloaded
  id: reload
- trigger: time_pattern
  seconds: /5
  id: tick
variables:
  review_topic: !input 'mqtt_topic'
  occupancy_topic_prefix: !input 'occupancy_prefix'
  camera_entity: !input 'camera'
  lamp: !input 'light_entity'
  required_zones: !input 'zones'
  required_severities: !input 'severities'
  required_labels:
  - person
  motion_entities: !input 'motion_sensors'
  solar_entity: !input 'sun_entity'
  solar_limit: !input 'sun_threshold'
  brightness_pct: !input 'brightness'
  delay_seconds: !input 'off_delay'
  debug_enabled: !input 'debug'
  maximum_minutes: !input 'maximum_on'
  zone_prefix: !input 'occupancy_prefix'
actions:
- variables:
    controller_key: '{{ ''automation_'' ~ (this.attributes.get(''id'',this.entity_id) | string) }}'
    message_source: '{{ trigger.id if trigger is defined and trigger.id is defined else ''manual'' }}'
    message_payload: '{{ trigger.payload if trigger is defined and trigger.id is defined and trigger.id in [''review'',''occupancy'',''object'']
      else '''' }}'
    message_topic: '{{ trigger.topic if trigger is defined and trigger.id is defined and trigger.id == ''occupancy'' else
      '''' }}'
- variables:
    cache_topic: '{{ ''frigate_camera_light/'' ~ (controller_key | regex_replace(''[^a-zA-Z0-9_-]'',''_'')) ~ ''/state'' }}'
- alias: Read the latest retained state for this queued run
  wait_for_trigger:
  - trigger: mqtt
    topic: '{{ cache_topic }}'
    qos: 1
  timeout:
    seconds: 2
  continue_on_timeout: true
- variables:
    stored: '{{ wait.trigger.payload | from_json({}) if wait.completed and wait.trigger is not none else {} }}'
- variables:
    cache_valid: '{{ stored is mapping and stored.get(''schema'') == 1 and stored.get(''owner'') == controller_key and stored.get(''state'',{})
      is mapping }}'
    last_light_command: '{{ stored.get(''last_command'',0) | int(0) if cache_valid else 0 }}'
    last_filter: '{{ stored.get(''last_filter'',''No review received'') if cache_valid else ''No review received'' }}'
    last_decision: '{{ stored.get(''last_decision'','''') if cache_valid else '''' }}'
- if:
  - condition: template
    value_template: '{{ not cache_valid and is_state(lamp,''on'') }}'
  then:
  - action: light.turn_off
    continue_on_error: true
    target:
      entity_id: '{{ lamp }}'
  - action: logbook.log
    continue_on_error: true
    data:
      name: Frigate Camera Light
      entity_id: '{{ lamp }}'
      message: State unavailable or invalid on {{ cache_topic }}. Requested OFF; check retained MQTT state and broker permissions.
  - stop: Controller state unavailable while light is on
    error: true
- if:
  - condition: template
    value_template: '{{ wait.completed and not cache_valid }}'
  then:
  - stop: Invalid retained controller state; check the internal state topic
    error: true
- variables:
    source: '{{ message_source }}'
    timestamp: '{{ as_timestamp(now()) | int }}'
    camera_id: '{{ state_attr(camera_entity,''camera_name'') | default('''',true) }}'
    packet: '{{ (message_payload if message_payload is mapping else message_payload | from_json({})) if source in [''review'',''object'']
      else {} }}'
    cached: '{{ stored.get(''state'',{}) if cache_valid and stored.get(''light'') == lamp else {} }}'
    previous_desired: '{{ cached.get(''w'',false) if cached is mapping else false }}'
    solar_raw: '{{ state_attr(solar_entity,''elevation'') if state_attr(solar_entity,''elevation'') is not none else states(solar_entity)
      }}'
- variables:
    after: '{{ packet.get(''after'',{}) if packet is mapping and packet.get(''after'',{}) is mapping else {} }}'
    cache: '{{ cached if cached is mapping else {} }}'
    solar_valid: '{{ states(solar_entity) not in [''unknown'',''unavailable''] and is_number(solar_raw) }}'
    before: '{{ packet.get(''before'',{}) if packet is mapping and packet.get(''before'',{}) is mapping else {} }}'
- variables:
    config_valid: '{{ camera_id | length > 0 and required_zones | length > 0 and required_severities | length > 0 }}'
    event_type: '{{ packet.get(''type'','''') if packet is mapping else '''' }}'
    event_data: '{{ after.get(''data'',{}) if after.get(''data'',{}) is mapping else {} }}'
    from_camera: '{{ source in [''review'',''object''] and after.get(''camera'','''') == camera_id and camera_id | length
      > 0 }}'
    motion_active: '{{ motion_entities | select(''is_state'',''on'') | list | length > 0 }}'
    dark: '{{ solar_valid and solar_raw | float(90) <= solar_limit | float }}'
    config_matches: '{{ cache.get(''v'') in [3,4] and cache.get(''m'') == ''presence'' and cache.get(''c'') == camera_id and
      cache.get(''z'',{}) is mapping and cache.get(''z'',{}) | list | sort == required_zones | sort }}'
- variables:
    prior: '{{ cache if config_matches else {} }}'
    event_zones: '{{ event_data.get(''zones'',[]) if event_data.get(''zones'',[]) is list else [] }}'
    event_objects: '{{ event_data.get(''objects'',[]) if event_data.get(''objects'',[]) is list else [] }}'
    zone_id: '{{ message_topic[(zone_prefix | length)+1:-7] if source == ''occupancy'' and message_topic.startswith(zone_prefix
      ~ ''/'') and message_topic.endswith(''/person'') else '''' }}'
    zone_count: '{{ message_payload | int(-1) if source == ''occupancy'' else -1 }}'
- variables:
    objects_ok: '{{ required_labels | select(''in'',event_objects | map(''regex_replace'',''-verified$'','''') | list) | list
      | length > 0 }}'
    severity_ok: '{{ after.get(''severity'','''') in required_severities }}'
    occupancy_usable: '{{ source == ''occupancy'' and zone_id in required_zones and zone_count | int >= 0 and is_number(message_payload)
      and message_payload | float == zone_count | int }}'
- variables:
    counts: |-
      {% set ns=namespace(z={}) %} {% for zone in required_zones %}
        {% set val=prior.get('z',{}).get(zone,-1) | int(-1) %}
        {% if occupancy_usable and zone_id == zone %}{% set val=zone_count | int %}{% endif %}
        {% set ns.z=dict(ns.z,**{zone:val}) %}
      {% endfor %} {{ ns.z }}
    review_id: '{{ after.get(''id'','''') if after.get(''id'','''') is string else '''' }}'
    review_message_valid: '{{ source == ''review'' and from_camera and event_type in [''new'',''update'',''end''] and after.get(''id'','''')
      is string and after.get(''id'','''') | length > 0 }}'
- variables:
    person_id: '{{ after.get(''id'','''') if after.get(''id'','''') is string else '''' }}'
    person_message_valid: |-
      {{ source == 'object' and from_camera and event_type in ['new','update','end']
         and after.get('label') == 'person' and after.get('false_positive') == false
         and after.get('id','') is string and after.get('id','') | length > 0 }}
    current_person_zones: '{{ after.get(''current_zones'',[]) if after.get(''current_zones'',[]) is list else [] }}'
    before_person_zones: '{{ before.get(''current_zones'',[]) if before.get(''current_zones'',[]) is list else [] }}'
    known_people: '{{ prior.get(''people'',{}) if prior.get(''people'',{}) is mapping else {} }}'
- variables:
    person_in_zone: '{{ required_zones | select(''in'',current_person_zones) | list | length > 0 }}'
    person_was_in_zone: '{{ required_zones | select(''in'',before_person_zones) | list | length > 0 }}'
    known_person: '{{ known_people.get(person_id,{}) if known_people.get(person_id,{}) is mapping else {} }}'
- variables:
    person_entry: |-
      {{ person_message_valid and event_type in ['new','update'] and after.get('end_time') is none
         and person_in_zone and not known_person.get('entered',false) and not known_person.get('ended',false)
         and (event_type == 'new' or (before.get('current_zones') is list and not person_was_in_zone)) }}
    person_registry: |-
      {% set ns=namespace(people={}) %} {% set lifetime=[3600,maximum_minutes | int * 60 + delay_seconds | int] | max %} {% for pid,item in known_people.items() %}
        {% if item is mapping and timestamp - item.get('seen',0) | int < lifetime %}
          {% set ns.people=dict(ns.people,**{pid:item}) %}
        {% endif %}
      {% endfor %} {% if person_message_valid %}
        {% set entry={'seen':timestamp,'entered':known_person.get('entered',false) or person_in_zone or person_was_in_zone,
          'in_zone':person_in_zone,
          'ended':known_person.get('ended',false) or event_type == 'end' or after.get('end_time') is not none} %}
        {% set ns.people=dict(ns.people,**{person_id:entry}) %}
      {% endif %} {{ ns.people }}
- variables:
    zones_clear: '{{ counts | length > 0 and counts.values() | select(''equalto'',0) | list | length == counts | length }}'
    missing_zones: '{{ counts.values() | select(''lt'',0) | list | length }}'
    occupied_zones: '{{ counts.values() | select(''gt'',0) | list | length }}'
- variables:
    review_registry: |-
      {% set ns=namespace(active={},ended={}) %} {% set old_active=prior.get('r',{}) if prior.get('r',{}) is mapping else {} %} {% set old_ended=prior.get('e',{}) if prior.get('e',{}) is mapping else {} %} {% set lifetime=[3600, maximum_minutes | int * 60 + delay_seconds | int] | max %} {% for rid,seen in old_active.items() %}
        {% if is_number(seen) and timestamp - seen | int < lifetime and seen | int <= timestamp %}
          {% set ns.active=dict(ns.active,**{rid:seen | int}) %}
        {% endif %}
      {% endfor %} {% for rid,seen in old_ended.items() %}
        {% if is_number(seen) and timestamp - seen | int < lifetime and seen | int <= timestamp %}
          {% set ns.ended=dict(ns.ended,**{rid:seen | int}) %}
        {% endif %}
      {% endfor %} {% if review_message_valid %}
        {% if event_type == 'end' or after.get('end_time') is not none %}
          {% set clean=namespace(active={}) %}
          {% for rid,seen in ns.active.items() if rid != review_id %}
            {% set clean.active=dict(clean.active,**{rid:seen}) %}
          {% endfor %}
          {% set ns.active=clean.active %}
          {% set ns.ended=dict(ns.ended,**{review_id:timestamp}) %}
        {% elif review_id not in ns.ended and (review_id in ns.active or (objects_ok and severity_ok)) %}
          {% set ns.active=dict(ns.active,**{review_id:timestamp}) %}
        {% endif %}
      {% endif %} {{ {'active':ns.active,'ended':ns.ended} }}
- variables:
    active_review_count: '{{ review_registry[''active''] | length }}'
- variables:
    fresh_review: |-
      {{ review_message_valid and review_id in review_registry['active']
         and review_id not in prior.get('r',{}) }}
    old_ticket: '{{ prior.get(''ticket'',{}) if prior.get(''ticket'',{}) is mapping else {} }}'
- variables:
    recovery_ticket: |-
      {% if prior.get('l',false) and fresh_review %}
        {{ {'kind':'review','id':review_id,'until':timestamp+30} }}
      {% elif prior.get('l',false) and person_entry %}
        {{ {'kind':'person','id':person_id,'until':timestamp+30} }}
      {% elif prior.get('l',false) and old_ticket.get('until',0) | int >= timestamp %}
        {{ old_ticket }}
      {% else %}{{ {} }}{% endif %}
- variables:
    ticket_valid: |-
      {% if recovery_ticket.get('kind') == 'review' %}
        {{ recovery_ticket.get('id') in review_registry['active'] }}
      {% elif recovery_ticket.get('kind') == 'person' %}
        {% set item=person_registry.get(recovery_ticket.get('id'),{}) %}
        {{ item is mapping and item.get('in_zone',false) and not item.get('ended',true) }}
      {% else %}{{ false }}{% endif %}
- variables:
    recovery: |-
      {{ prior.get('l',false) and ticket_valid and active_review_count | int > 0
         and occupied_zones | int > 0 and dark and config_valid
         and timestamp - prior.get('lock_at',timestamp) | int >= 5 }}
- variables:
    armed: '{{ (active_review_count | int > 0 and occupied_zones | int > 0 and dark) or (prior.get(''a'',false) and dark and
      (not zones_clear or previous_desired or prior.get(''l'',false))) }}'
- variables:
    raw_demand: '{{ motion_active or (armed and not zones_clear) }}'
- variables:
    off_at: '{% if raw_demand or prior.get(''l'',false) %}{{ 0 }} {% elif prior.get(''o'',0) | int > 0 %}{{ prior.get(''o'',0)
      | int }} {% elif prior.get(''h'',false) %}{{ timestamp + delay_seconds | int }} {% else %}{{ 0 }}{% endif %}'
    previous_lock: '{{ prior.get(''l'',false) and not recovery }}'
- variables:
    remaining: '{{ [0, off_at | int - timestamp] | max }}'
    demand_with_delay: '{{ raw_demand or off_at | int > timestamp }}'
- variables:
    run_start: |-
      {% if config_valid and dark and demand_with_delay and not previous_lock %}
        {{ timestamp if recovery else (prior.get('s',0) | int if prior.get('s',0) | int > 0 else timestamp) }}
      {% else %}{{ prior.get('s',0) | int if previous_lock else 0 }}{% endif %}
- variables:
    limit_reached: '{{ run_start | int > 0 and timestamp - run_start | int >= maximum_minutes | float * 60 }}'
- variables:
    locked: '{{ (previous_lock or limit_reached) and raw_demand }}'
    limit_block: '{{ previous_lock or limit_reached }}'
    next_state: '{{ {''v'':4,''m'':''presence'',''c'':camera_id,''z'':counts,''r'':review_registry[''active''],''e'':review_registry[''ended''],''people'':person_registry,''ticket'':recovery_ticket
      if locked else {},''lock_at'':(prior.get(''lock_at'',timestamp) if prior.get(''l'',false) else timestamp) if locked
      else 0,''a'':armed and dark and (raw_demand or remaining | int > 0),''h'':raw_demand,''o'':off_at | int,''s'':run_start
      | int if demand_with_delay else 0,''l'':locked} }}'
- variables:
    wanted: '{{ config_valid and dark and demand_with_delay and not limit_block }}'
    decision: |-
      {% if not config_valid %}ERROR: Check camera and filters
      {% elif limit_block %}MAX reached: waiting for clear or fresh activity
      {% elif not solar_valid %}ERROR: Sun elevation unavailable
      {% elif not dark %}Daylight: light blocked
      {% elif recovery %}Fresh activity: new lighting session
      {% elif motion_active %}Motion sensor active
      {% elif armed and occupied_zones | int > 0 %}Person occupancy active
      {% elif armed and missing_zones | int > 0 %}Waiting for {{ missing_zones }} zone counts
      {% elif remaining | int > 0 %}Cooldown {{ remaining }}s
      {% elif active_review_count | int > 0 %}Review authorized; waiting for zone occupancy
      {% elif occupied_zones | int > 0 %}Zone occupied; waiting for an eligible person review
      {% else %}No light request{% endif %}
    filter_result: |-
      {% if source == 'occupancy' and occupancy_usable %}{{ zone_id }}: {{ zone_count }} people
      {% elif source == 'occupancy' %}Unmatched or invalid count
      {% elif source == 'object' and person_entry %}New tracked person entered a selected zone
      {% elif source == 'object' %}Tracked person update; no new zone entry
      {% elif source != 'review' %}{{ last_filter }}
      {% elif not from_camera %}Other camera or invalid packet
      {% elif review_message_valid and (event_type == 'end' or after.get('end_time') is not none) %}Review ended; authorization removed
      {% elif review_id in review_registry['ended'] %}Completed review ignored
      {% elif review_id in review_registry['active'] %}Review accepted
      {% elif not severity_ok %}Severity not selected
      {% elif not objects_ok %}No matching object type
      {% else %}Review ignored{% endif %}
- variables:
    state_changed: '{{ wanted != previous_desired }}'
    status_text: '{{ (''ON '' ~ (brightness_pct | int) ~ ''%'' if wanted else ''OFF'') ~ '' | '' ~ decision | trim ~ '' |
      Sun '' ~ ((solar_raw | float | round(1) | string) if solar_valid else ''?'') ~ '' | Filter: '' ~ filter_result | trim
      }}'
    command_needed: '{{ state_changed or source in [''startup'',''reload'',''manual''] or (timestamp - last_light_command
      | int >= 30 and states(lamp) in [''on'',''off''] and is_state(lamp,''on'') != wanted) }}'
    report_needed: '{{ debug_enabled and (state_changed or recovery or person_entry or locked != previous_lock or decision
      | trim != last_decision or (source == ''review'' and from_camera) or (source == ''occupancy'' and occupancy_usable))
      }}'
- if:
  - condition: template
    value_template: '{{ report_needed }}'
  then:
  - action: logbook.log
    continue_on_error: true
    data:
      name: Frigate Camera Light
      entity_id: '{{ lamp }}'
      message: '{{ status_text }} | Source={{ source }}'
  - event: frigate_camera_light_status
    event_data:
      camera: '{{ camera_entity }}'
      light: '{{ lamp }}'
      requested_on: '{{ wanted }}'
      brightness_pct: '{{ brightness_pct | int if wanted else 0 }}'
      decision: '{{ decision | trim }}'
      filter: '{{ filter_result | trim }}'
      zone_counts: '{{ counts }}'
      cooldown_remaining: '{{ remaining }}'
      maximum_on_minutes: '{{ maximum_minutes }}'
      locked_out: '{{ locked }}'
      source: '{{ source }}'
      review_id: '{{ review_id if source == ''review'' else '''' }}'
      review_type: '{{ event_type }}'
      review_severity: '{{ after.get("severity", "") }}'
      review_zones: '{{ event_zones }}'
      required_zones: '{{ required_zones }}'
      state_topic: '{{ cache_topic }}'
      eligible_review_count: '{{ active_review_count }}'
      review_authorized: '{{ active_review_count | int > 0 }}'
      zone_occupied: '{{ occupied_zones | int > 0 }}'
      person_id: '{{ person_id if source == ''object'' else '''' }}'
      person_entry: '{{ person_entry }}'
      recovered_from_lockout: '{{ recovery }}'
      recovery_pending: '{{ recovery_ticket | length > 0 and locked }}'
      recovery_reason: '{{ recovery_ticket.get(''kind'','''') }}'
- alias: Commit controller state before controlling the light
  action: mqtt.publish
  data:
    topic: '{{ cache_topic }}'
    qos: 1
    retain: true
    payload: |-
      {{ {'schema':1,'owner':controller_key,'light':lamp,'saved_at':timestamp,
          'state':dict(next_state,w=wanted),
          'last_command':timestamp if command_needed else last_light_command,
          'last_filter':filter_result | trim,'last_decision':decision | trim} | to_json }}
- if:
  - condition: template
    value_template: '{{ command_needed }}'
  then:
  - variables:
      last_light_command: '{{ timestamp }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wanted }}'
      sequence:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ lamp }}'
        data:
          brightness_pct: '{{ brightness_pct | int }}'
    default:
    - action: light.turn_off
      continue_on_error: true
      target:
        entity_id: '{{ lamp }}'
max: 200
conditions:
- condition: template
  value_template: |-
    {% if trigger is not defined or trigger.id is not defined %}{{ true }}
    {% elif trigger.id in ['review','object'] %}
      {% set p=trigger.payload | from_json({}) %}
      {{ p is mapping and p.get('after',{}) is mapping
         and p.get('after',{}).get('camera','') == state_attr(camera_entity,'camera_name') }}
    {% elif trigger.id == 'occupancy' %}
      {{ trigger.topic.startswith(zone_prefix ~ '/') and trigger.topic.endswith('/person')
         and trigger.topic[(zone_prefix | length)+1:-7] in required_zones }}
    {% else %}{{ true }}{% endif %}
